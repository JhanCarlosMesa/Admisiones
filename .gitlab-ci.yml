###############################################################################
# .gitlab-ci.yml — Pipeline "All Green" para Admisiones UNAC
#
# Stages:
#   build    -> compila el front-end
#   validate -> terraform init -backend=false + validate + fmt
#   plan     -> terraform plan (con AMI real)
#   apply    -> terraform apply + (en paralelo) sync de dist/ al bucket S3
#   upload   -> (manual) recompila el front-end y sube dist/ + gateway/ al bucket
#   smoke    -> curl al endpoint público, valida que sirve la app
#   destroy  -> terraform destroy automático (deja todo limpio)
#
# Variables requeridas en GitLab (Settings > CI/CD > Variables):
#   AWS_ACCESS_KEY_ID       (masked + protected)
#   AWS_SECRET_ACCESS_KEY   (masked + protected)
#   TF_VAR_ami_id           (ej: ami-0497c3363f8a186f8)
###############################################################################

stages:
  - build
  - validate
  - plan
  - apply
  - upload
  - smoke
  - destroy

variables:
  TF_ROOT: "terraform"
  TF_IN_AUTOMATION: "true"

# ----------------------------------------------------------------------------
# 1) Build del front-end
# ----------------------------------------------------------------------------
build:
  stage: build
  image: node:20-alpine
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 30 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 2) terraform validate + fmt
# ----------------------------------------------------------------------------
terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["build"]
  script:
    - cd "$TF_ROOT"
    - terraform version
    - terraform init -backend=false -input=false
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 3) terraform plan (lee TF_VAR_ami_id del entorno automáticamente)
# ----------------------------------------------------------------------------
terraform-plan:
  stage: plan
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["terraform-validate"]
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform plan -input=false -out=plan.tfplan
  artifacts:
    paths:
      - $TF_ROOT/plan.tfplan
    expire_in: 30 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 4a) terraform apply y exporta outputs como dotenv
# ----------------------------------------------------------------------------
terraform-apply:
  stage: apply
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["terraform-plan"]
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform apply -auto-approve plan.tfplan
    - |
      APP_URL=$(terraform output -raw gateway_url)
      S3_BUCKET=$(terraform output -raw s3_bucket_name_out)
      PUBLIC_IP=$(terraform output -raw public_ip)
      echo "APP_URL=$APP_URL"       > deploy.env
      echo "S3_BUCKET=$S3_BUCKET"   >> deploy.env
      echo "PUBLIC_IP=$PUBLIC_IP"   >> deploy.env
      echo "Aplicación disponible en: $APP_URL"
  artifacts:
    paths:
      - terraform/deploy.env
    reports:
      dotenv: terraform/deploy.env
    expire_in: 30 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 4b) Subir dist/ al bucket S3
# Necesita: artifact dist/ (del job build) y dotenv con S3_BUCKET (de apply)
# ----------------------------------------------------------------------------
upload-site:
  stage: apply
  image:
    name: amazon/aws-cli:2.17.0
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
    - job: terraform-apply
      artifacts: true
  script:
    - echo "Subiendo dist/ a s3://$S3_BUCKET/"
    - aws s3 sync dist/ "s3://$S3_BUCKET/site/" --delete --region us-east-2
    - aws s3 ls "s3://$S3_BUCKET/site/" --region us-east-2
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 4c) Upload manual: compila el front-end y sube TODO al bucket
#     - dist/   -> s3://$S3_BUCKET/site/    (el sitio)
#     - gateway/ -> s3://$S3_BUCKET/gateway/ (el gateway institucional)
#
# El bucket NO se hardcodea: el nombre real lo produce Terraform
# (${var.project_name}-${cuenta}-${var.environment}) y llega por el dotenv
# del job terraform-apply. Si se fijara aquí, el job fallaría contra un
# bucket inexistente.
#
# Solo se sube el código del gateway: se excluyen .env, keys/ (llave privada)
# y data/ (cadena local), que nunca deben salir de la máquina.
# ----------------------------------------------------------------------------
upload-app:
  stage: upload
  image: node:20
  needs:
    - job: terraform-apply
      artifacts: true   # <- dotenv con $S3_BUCKET
  script:
    - npm ci
    - npm run build
    - pip3 install awscli --break-system-packages || (apt-get update && apt-get install -y awscli)
    - echo "Subiendo dist/ a s3://$S3_BUCKET/site/"
    - aws s3 sync dist/ "s3://$S3_BUCKET/site/" --delete --region us-east-2
    - echo "Subiendo gateway/ a s3://$S3_BUCKET/gateway/"
    - aws s3 sync gateway/ "s3://$S3_BUCKET/gateway/" --delete --region us-east-2 --exclude "node_modules/*" --exclude ".env" --exclude "keys/*" --exclude "data/*"
    - aws s3 ls "s3://$S3_BUCKET/" --region us-east-2
  when: manual
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ----------------------------------------------------------------------------
# 5) Smoke test: espera al user_data de la EC2 y verifica el HTML
# ----------------------------------------------------------------------------
smoke-test:
  stage: smoke
  image: curlimages/curl:8.7.1
  needs:
    - job: upload-site
    - job: terraform-apply
      artifacts: true   # <- para tener $APP_URL del dotenv
  script:
    - sh ci/smoke.sh
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 6) terraform destroy (automático, deja todo limpio)
# ----------------------------------------------------------------------------
terraform-destroy:
  stage: destroy
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["smoke-test"]
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform destroy -auto-approve
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
