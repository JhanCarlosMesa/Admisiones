###############################################################################
# .gitlab-ci.yml — Pipeline "All Green" para Admisiones UNAC
#
# Stages:
#   build    -> compila el front-end
#   validate -> terraform init -backend=false + validate + fmt
#   plan     -> terraform plan (con AMI real)
#   apply    -> terraform apply + (en paralelo) sync de dist/ al bucket S3
#   smoke    -> curl al endpoint público, valida que sirve la app
#   destroy  -> terraform destroy automático (deja todo limpio)
#
# Variables requeridas en GitLab (Settings > CI/CD > Variables):
#   AWS_ACCESS_KEY_ID       (masked + protected)
#   AWS_SECRET_ACCESS_KEY   (masked + protected)
#   TF_VAR_ami_id           (ej: ami-0497c3363f8a186f8)
###############################################################################

stages:
  - build
  - validate
  - plan
  - apply
  - smoke
  - destroy

variables:
  TF_ROOT: "terraform"
  TF_IN_AUTOMATION: "true"

# ----------------------------------------------------------------------------
# 1) Build del front-end
# ----------------------------------------------------------------------------
build:
  stage: build
  image: node:20-alpine
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 30 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 2) terraform validate + fmt
# ----------------------------------------------------------------------------
terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["build"]
  script:
    - cd "$TF_ROOT"
    - terraform version
    - terraform init -backend=false -input=false
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 3) terraform plan (lee TF_VAR_ami_id del entorno automáticamente)
# ----------------------------------------------------------------------------
terraform-plan:
  stage: plan
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["terraform-validate"]
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform plan -input=false -out=plan.tfplan
  artifacts:
    paths:
      - $TF_ROOT/plan.tfplan
    expire_in: 30 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 4a) terraform apply y exporta outputs como dotenv
# ----------------------------------------------------------------------------
terraform-apply:
  stage: apply
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["terraform-plan"]
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform apply -auto-approve plan.tfplan
    - |
      APP_URL=$(terraform output -raw app_url)
      S3_BUCKET=$(terraform output -raw s3_bucket)
      PUBLIC_IP=$(terraform output -raw public_ip)
      echo "APP_URL=$APP_URL"       > deploy.env
      echo "S3_BUCKET=$S3_BUCKET"   >> deploy.env
      echo "PUBLIC_IP=$PUBLIC_IP"   >> deploy.env
      echo "Aplicación disponible en: $APP_URL"
  artifacts:
    paths:
      - $TF_ROOT/outputs.json
    reports:
      dotenv: deploy.env
    expire_in: 30 minutes
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 4b) Subir dist/ al bucket S3
# Necesita: artifact dist/ (del job build) y dotenv con S3_BUCKET (de apply)
# ----------------------------------------------------------------------------
upload-site:
  stage: apply
  image: amazon/aws-cli:2.17.0
  needs:
    - job: build
      artifacts: true
    - job: terraform-apply
      artifacts: true
  script:
    - echo "Subiendo dist/ a s3://$S3_BUCKET/"
    - aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --region us-east-2
    - aws s3 ls "s3://$S3_BUCKET/" --region us-east-2
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 5) Smoke test: espera al user_data de la EC2 y verifica el HTML
# ----------------------------------------------------------------------------
smoke-test:
  stage: smoke
  image: curlimages/curl:8.7.1
  needs:
    - job: upload-site
    - job: terraform-apply
      artifacts: true   # <- para tener $APP_URL del dotenv
  script:
    - chmod +x ci/smoke.sh
    - ./ci/smoke.sh
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ----------------------------------------------------------------------------
# 6) terraform destroy (automático, deja todo limpio)
# ----------------------------------------------------------------------------
terraform-destroy:
  stage: destroy
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  needs: ["smoke-test"]
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform destroy -auto-approve
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
